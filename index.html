<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Catalogue</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f2b64a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <header id="hud">
      <div class="title"><strong>Tiny Catalogue</strong></div>
      <span id="hint"></span>
      <span class="spacer"></span>
      <button id="paletteBtn" type="button" title="Colour palette">🎨<span> Colours</span></button>
    </header>
    <main id="catalog">
      <div class="cat-tabs"></div>
      <div class="cat-grid"></div>
    </main>
    <aside id="item" hidden></aside>
    <div id="palettePanel" hidden role="dialog" aria-label="Colour palette"></div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

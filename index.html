<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Catalogue</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f2b64a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <header id="hud">
      <div class="title"><strong>Tiny Catalogue</strong></div>
      <span id="hint"></span>
      <span class="spacer"></span>
      <button id="ps1Btn" type="button" aria-pressed="true" title="PS1 look is on. Click for a smooth render.">PS1</button>
      <button id="paletteBtn" type="button" title="Colour palette">🎨<span> Colours</span></button>
    </header>
    <main id="catalog">
      <div class="cat-nav">
        <form class="cat-search" role="search">
          <input id="catSearch" type="text" placeholder="Search all items" aria-label="Search all items" autocomplete="off" enterkeyhint="search" spellcheck="false" />
          <button id="catSearchClear" type="button" aria-label="Clear search" hidden>×</button>
          <kbd class="cat-kbd" aria-hidden="true">/</kbd>
        </form>
        <div class="cat-groups" role="toolbar" aria-label="Catalogue groups"></div>
        <div class="cat-sub"></div>
        <div class="cat-tags"></div>
        <div class="cat-bar">
          <div class="cat-heading">
            <h1 id="catTitle">Catalogue</h1>
            <span id="catCount" class="cat-count" hidden></span>
          </div>
          <p id="catScope" class="cat-scope" hidden></p>
          <div class="cat-views" role="group" aria-label="Layout">
            <button type="button" id="viewGrid" aria-pressed="true">Grid</button>
            <button type="button" id="viewList" aria-pressed="false">List</button>
          </div>
        </div>
        <p class="cat-meta" aria-live="polite"></p>
      </div>
      <div class="cat-grid">
        <p class="cat-boot" id="catBoot">Loading catalogue…</p>
      </div>
    </main>
    <div id="stageTools" hidden>
      <button type="button" data-cam="turn-left" aria-label="Orbit left">Orbit left</button>
      <button type="button" data-cam="turn-right" aria-label="Orbit right">Orbit right</button>
      <button type="button" data-cam="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" data-cam="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" data-cam="reset">Reset</button>
      <button type="button" data-cam="grid" aria-pressed="true">Grid</button>
      <button type="button" data-cam="figure" aria-pressed="false" title="Show a faceless figure 1.6 m tall">1.6 m</button>
    </div>
    <aside id="item" hidden></aside>
    <div id="palettePanel" hidden role="dialog" aria-label="Colour palette"></div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
